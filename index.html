<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 먹지?</title>
  <!--
    ES module(import/export)을 사용하므로 file:// 로 직접 열면 동작하지 않습니다.
    로컬 서버로 실행하세요. 예) 프로젝트 루트에서:
      python3 -m http.server 8000
    그 후 http://localhost:8000 접속.
  -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">🍚 오늘 뭐 먹지?</h1>
      <p class="app-subtitle">혼밥러를 위한 메뉴 룰렛</p>
    </header>

    <!-- 결과 카드 (주인공) -->
    <section
      id="result-card"
      class="result-card is-empty"
      aria-live="polite"
    >
      <div class="result-emoji" id="result-emoji">🎲</div>
      <div class="result-name" id="result-name">버튼을 눌러 오늘의 메뉴를 정하세요</div>
      <div class="result-tags" id="result-tags"></div>
      <p class="result-comment" id="result-comment"></p>
    </section>

    <!-- 미니 안내 (후보 1개 등) -->
    <p class="mini-hint" id="mini-hint" hidden></p>

    <!-- 후보 0개 강조 배너 -->
    <div class="empty-banner" id="empty-banner" hidden>
      <span>조건에 맞는 메뉴가 없어요. 필터를 풀어 보세요.</span>
      <button type="button" class="btn-reset" id="reset-filters">필터 초기화</button>
    </div>

    <!-- 메인 버튼 -->
    <button type="button" class="btn-main" id="spin-btn">🎲 메뉴 추천받기</button>

    <!-- 근처 식당 (메뉴 추천 후 노출) -->
    <section class="near-section" id="near-section" hidden>
      <h2 class="near-title" id="near-title">근처 식당 찾기</h2>
      <div class="near-search">
        <input
          type="text"
          id="dong-input"
          class="dong-input"
          inputmode="text"
          autocomplete="off"
          placeholder="동네 입력 (예: 역삼동, 서면)"
          aria-label="동네 입력"
        />
        <button type="button" class="btn-near" id="near-btn">🔍 찾기</button>
      </div>
      <button type="button" class="btn-gps" id="gps-btn">📍 현재 위치로 찾기</button>
      <p class="near-status" id="near-status" hidden></p>
      <ul class="resto-list" id="resto-list"></ul>
    </section>

    <!-- 필터 헤더 -->
    <div class="filter-header">
      <h2 class="filter-title">필터</h2>
      <span class="candidate-count" id="candidate-count">후보 0개</span>
    </div>

    <!-- 카테고리 칩 -->
    <div class="chip-group" id="category-chips" role="group" aria-label="카테고리"></div>

    <!-- 조리방식 칩 -->
    <div class="chip-group" id="type-chips" role="group" aria-label="조리방식"></div>

    <!-- 혼밥친화 스위치 -->
    <div class="switch-row">
      <span class="switch-label">혼밥친화 메뉴만</span>
      <button
        type="button"
        class="switch"
        id="solo-switch"
        role="switch"
        aria-checked="true"
      >
        <span class="switch-thumb"></span>
      </button>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
